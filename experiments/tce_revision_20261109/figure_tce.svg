<text x="655" y="155" font-size="12" fill="#6B7280">残影类输出不部署</text>

<!-- decode path -->
<line x1="619" y1="135" x2="619" y2="192" stroke="#16A34A" stroke-width="2.4" marker-end="url(#agr)"/>
<rect x="529" y="198" width="180" height="40" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
