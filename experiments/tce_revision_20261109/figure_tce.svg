<!-- loss decomposition -->
<rect x="760" y="212" width="140" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
<text x="830" y="236" font-size="13.5" fill="#374151" text-anchor="middle">时序标签锚点</text>
<line x1="900" y1="224" x2="930" y2="262" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>
<line x1="900" y1="244" x2="930" y2="306" stroke="#D97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ag)"/>
