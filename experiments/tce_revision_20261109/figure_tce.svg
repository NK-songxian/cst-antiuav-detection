<text x="619" y="362" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">检测结果 N×6（当前类）</text>
<text x="40" y="430" font-size="12.5" fill="#6B7280">Backbone–Neck–Head 与基线完全一致，推理路径不增加任何计算。</text>

<!-- ===== Panel (b) ===== -->
<rect x="740" y="20" width="640" height="440" rx="10" fill="#FAFAFA" stroke="#E5E7EB"/>
