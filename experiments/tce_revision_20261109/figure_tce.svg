<text x="1176" y="320" font-size="13.5" fill="#374151" text-anchor="middle">回归损失 L_box + L_DFL</text>

<line x1="1046" y1="278" x2="1084" y2="248" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>
<line x1="1046" y1="288" x2="1084" y2="312" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>
<line x1="1046" y1="324" x2="1084" y2="250" stroke="#D97706" stroke-width="2" marker-end="url(#ag)"/>
<line x1="1046" y1="334" x2="1084" y2="330" stroke="#D97706" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="1078" y1="322" x2="1094" y2="340" stroke="#D97706" stroke-width="2.6"/>
<line x1="1094" y1="322" x2="1078" y2="340" stroke="#D97706" stroke-width="2.6"/>
<text x="1010" y="360" font-size="12.5" fill="#B45309" font-weight="bold">解耦：残影不进回归</text>

<text x="760" y="404" font-size="14.5" fill="#111827" font-weight="bold">L = L_cls（全部实例） + 𝟙[cur] ·（L_box + L_DFL）</text>
<text x="760" y="428" font-size="12.5" fill="#6B7280">回归归一化按当前类分数求和，与单类基线严格对齐。</text>
</svg>
